<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHRleHQgeD0iMzIiIHk9IjU0IiBmb250LXNpemU9IjU0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7wn46EPC90ZXh0Pjwvc3ZnPg=="><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><title>Deep Sky · 星海深处</title><style>/* ================= 1. 基础设置 ================= */body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Microsoft YaHei', 'Songti SC', serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Monoton&family=Abril+Fatface&family=Ma+Shan+Zheng&display=swap');

        /* ================= 2. UI 视觉 (V17.6.3 原版样式) ================= */:root {
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --accent-gold: #7fd8ff;
            --accent-gold-gradient: linear-gradient(135deg, #eaf3ff 0%, #7fd8ff 100%);
            --text-main: #ffffff;
            --text-sub: #b0b0b5;
            --panel-width: 210px;
            --ui-scale: 0.9; 
        }

        @media screen and (max-height: 800px) { :root { --ui-scale: 0.8; } }
        @media screen and (min-width: 2000px) { :root { --ui-scale: 1.1; } }
        :fullscreen { --ui-scale: 1.0; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0.5px 0.5px 0px var(--glass-highlight), inset -0.5px -0.5px 0px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-sizing: border-box;
        }

        #left-sidebar, .bottom-left-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .panel-hidden { transform: translateX(calc(-1 * var(--panel-width) - 50px)) scale(var(--ui-scale)) !important; opacity: 0 !important; pointer-events: none !important; }
        .hidden { display: none !important; }

        #left-sidebar { position: absolute; top: 15px; left: 15px; width: var(--panel-width); height: calc(100vh - 30px); display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; transform: scale(var(--ui-scale)); transform-origin: top left; }
        .scroll-content { flex: 1; overflow-y: auto; pointer-events: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
        .scroll-content::-webkit-scrollbar { display: none; }

        .bottom-left-panel { position: absolute; bottom: 15px; left: 15px; pointer-events: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: var(--panel-width); padding: 10px; box-sizing: border-box; transform: scale(var(--ui-scale)); transform-origin: bottom left; }
        .bottom-left-panel .ui-title-main { grid-column: span 2; font-size: 11px; margin-bottom: 4px; padding-bottom: 2px; }
        .bottom-left-panel .elegant-btn { width: 100%; font-size: 10px; height: 28px; }

        /* 修复 input file 样式 */.bottom-left-panel .elegant-btn { width: 100%; font-size: 10px; height: 28px; position: relative; }
        .elegant-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .ui-title-main { font-family: 'SimSun', 'Songti SC', serif; font-size: 14px; font-weight: bold; color: #eaf3ff; text-shadow: 0 0 10px rgba(127, 216, 255, 0.3); border-bottom: 1px solid rgba(127, 216, 255, 0.2); padding-bottom: 4px; margin-bottom: 6px; letter-spacing: 2px; text-align: center; }
        .ui-title-sub { font-size: 12px; color: #b0b0b5; margin-top: 6px; margin-bottom: 3px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .control-label { color: #aaa; font-size: 11px; font-weight: 700; }
        .control-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; }
        .control-row { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }

        .particle-scroll-container { max-height: 140px; overflow-y: auto; padding-right: 4px; margin-right: -4px; border-left: 2px solid rgba(127,216,255,0.1); padding-left: 6px; }
        .particle-scroll-container::-webkit-scrollbar { width: 3px; }
        .particle-scroll-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 2px; }
        .particle-scroll-container::-webkit-scrollbar-thumb { background: rgba(127,216,255,0.4); border-radius: 2px; }

        .elegant-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(127, 216, 255, 0.3); color: #7fd8ff; padding: 5px 0; cursor: pointer; text-transform: uppercase; font-size: 10px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; border-radius: 4px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; text-decoration: none; }
        .elegant-btn:hover { background: rgba(127, 216, 255, 0.1); border-color: #eaf3ff; color: #fff; box-shadow: 0 0 15px rgba(127, 216, 255, 0.4); text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
        .elegant-btn:active { transform: scale(0.98); }
        .btn-red { border-color: #844; color: #eaa; }
        .btn-red:hover { background: #522; box-shadow: 0 0 15px rgba(255, 50, 50, 0.3); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 3px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 1px; }
        input[type=range]::-webkit-slider-thumb { height: 9px; width: 9px; border-radius: 50%; background: #7fd8ff; cursor: pointer; -webkit-appearance: none; margin-top: -4px; box-shadow: 0 0 5px rgba(127, 216, 255, 0.8); border: 1px solid #000; transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); background: #fff; }

        .input-glass { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #9ad8ff; padding: 3px; font-size: 10px; outline: none; transition: 0.3s; border-radius: 2px; width: 100%; box-sizing: border-box; text-align: center; height: 24px; }
        .input-glass:focus { border-color: #7fd8ff; background: rgba(0,0,0,0.6); }
        select.input-glass { cursor: pointer; }
        select.input-glass option { background: #000; color: #7fd8ff; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 16px; cursor: pointer; padding: 0; background: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #title-container { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: auto; cursor: move; z-index: 50; transition: color 0.2s; user-select: none; padding: 10px; }
        .title-line { margin: 0; transition: all 0.2s ease; white-space: nowrap; color: #eaf3ff; text-shadow: 0 0 30px rgba(255, 255, 255, 0.2); }
        .top-left-panel { pointer-events: auto; display: flex; flex-direction: column; gap: 4px; padding: 10px; width: 100%; box-sizing: border-box; }
        .interaction-grid { display: flex; gap: 4px; margin-bottom: 4px; }
        .direction-pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05); }
        .dir-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(127,216,255,0.2); color: #7fd8ff; text-align: center; cursor: pointer; padding: 5px 0; border-radius: 2px; font-size: 11px; user-select: none; transition: 0.2s; }
        .dir-btn:hover { background: rgba(127,216,255,0.2); color: #fff; box-shadow: 0 0 8px rgba(127,216,255,0.2); }
        .dir-btn:active { background: #7fd8ff; color: #000; }
        
        #top-right-controls { position: absolute; top: 15px; right: 15px; pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 50; }
        #webcam-wrapper { position: absolute; bottom: 15px; right: 15px; width: 160px; height: 120px; border: 1px solid rgba(127, 216, 255, 0.5); border-radius: 4px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.9); overflow: hidden; z-index: 20; pointer-events: auto; background: #000; transition: opacity 0.4s ease, transform 0.4s ease; }
        #webcam-wrapper.camera-hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
        #webcam-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        #cam-status { position: absolute; bottom: 5px; right: 5px; width: 6px; height: 6px; background: #550000; border-radius: 50%; box-shadow: 0 0 4px #ff0000; z-index: 30; transition: 0.2s; }
        #cam-status.active { background: #00ff00; box-shadow: 0 0 6px #00ff00; }
        
        #delete-manager { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(10px); }
        #photo-grid { display: flex; flex-wrap: wrap; gap: 15px; width: 70%; height: 60%; overflow-y: auto; justify-content: center; padding: 20px; border: 1px solid rgba(127,216,255,0.3); margin: 20px 0; background: rgba(0,0,0,0.5); border-radius: 8px; }
        .photo-item { width: 80px; height: 80px; position: relative; border: 1px solid #7fd8ff; transition: 0.2s; cursor: pointer; }
        .photo-item:hover { transform: scale(1.1); border-color: #fff; box-shadow: 0 0 15px rgba(127,216,255,0.5); }
        .photo-thumb { width: 100%; height: 100%; object-fit: cover; }
        .delete-x { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; background: #900; color: white; border-radius: 50%; text-align: center; line-height: 18px; font-size: 12px; cursor: pointer; font-weight: bold; border: 1px solid #fff; }
        .manager-title { color: #7fd8ff; font-size: 20px; font-family: 'Microsoft YaHei', serif; letter-spacing: 2px; }
        
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .spinner { width: 50px; height: 50px; border: 1px solid rgba(127, 216, 255, 0.1); border-top: 2px solid #7fd8ff; border-radius: 50%; animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: #7fd8ff; font-size: 12px; letter-spacing: 4px; margin-top: 25px; font-family: 'Cinzel', serif; opacity: 0.8; }
        

        /* ================= 4. 摄像头状态 ================= */
        #cam-msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px; font-size: 9px; line-height: 1.25;
            color: #f1d78a; background: linear-gradient(transparent, rgba(0,0,0,0.8)); text-align: center; pointer-events: none; }
        .cam-retry { position: absolute; top: 2px; left: 2px; display: none; padding: 2px 7px; font-size: 10px; line-height: 1.4;
            color: #050505; background: #7fd8ff; border: none; border-radius: 3px; cursor: pointer; z-index: 31; font-family: inherit; }
        .cam-retry.show { display: block; }
        #gesture-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: rgba(127,216,255,0.7); font-size: 10px; pointer-events: none; text-shadow: 0 0 5px #000; z-index: 5; }

        /* ================= 3. 移动端适配 (v17.6.5-m) ================= */
        #mobile-bar { display: none; }
        @media (max-width: 760px), (hover: none) and (pointer: coarse) {
            :root { --ui-scale: 1; }
            html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
            body { -webkit-user-select: none; user-select: none; }
            #canvas-container { height: 100vh; height: 100dvh; touch-action: none; }
            #title-container { top: 12%; padding: 6px; cursor: default; }
            .title-line { white-space: normal; }

            #top-right-controls { top: calc(6px + env(safe-area-inset-top)); right: 6px; gap: 6px; }
            #top-right-controls .elegant-btn { font-size: 11px !important; min-height: 34px; padding: 4px 10px !important; }

            #left-sidebar {
                position: fixed; left: 6px; right: 6px; bottom: calc(74px + env(safe-area-inset-bottom)); top: auto;
                width: auto; height: auto; box-sizing: border-box; max-height: 58vh; max-height: 58dvh; overflow-y: auto;
                -webkit-overflow-scrolling: touch; transform: none; transform-origin: bottom center;
                pointer-events: auto; padding: 8px 8px calc(78px + env(safe-area-inset-bottom)); border-radius: 16px;
                background: rgba(10,10,14,0.95); border: 1px solid rgba(255,255,255,0.10);
                box-shadow: 0 12px 40px rgba(0,0,0,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; z-index: 40;
            }
            #left-sidebar > .glass-panel, #left-sidebar > .top-left-panel {
                background: transparent !important; border: none !important; box-shadow: none !important;
                backdrop-filter: none !important; -webkit-backdrop-filter: none !important; padding: 6px; overflow: visible !important;
            }
            #left-sidebar.panel-hidden { transform: translateY(calc(100% + 110px)) !important; opacity: 0 !important; pointer-events: none !important; }
            .bottom-left-panel { position: static !important; width: 100% !important; transform: none !important; margin-top: 6px; padding: 8px; }
            .bottom-left-panel .elegant-btn { min-height: 40px; font-size: 12px !important; }

            .elegant-btn { min-height: 38px; font-size: 12px; }
            .dir-btn { min-height: 44px; font-size: 15px; padding: 0; line-height: 44px; }
            input[type=range] { height: 28px; }
            input[type=range]::-webkit-slider-thumb { height: 18px; width: 18px; margin-top: -9px; }
            .input-glass, select.input-glass, input[type=text] { font-size: 16px !important; height: 38px; }
            .ui-title-sub { font-size: 12px; }
            .particle-scroll-container { max-height: 170px; }

            #gesture-hint { bottom: calc(70px + env(safe-area-inset-bottom)); font-size: 11px; }
            #webcam-wrapper { top: calc(6px + env(safe-area-inset-top)); left: 6px; right: auto; bottom: auto; width: 96px; height: 72px; }
            #photo-grid { width: 92% !important; }

            #mobile-bar {
                display: flex; position: fixed; left: 6px; right: 6px; bottom: calc(6px + env(safe-area-inset-bottom));
                gap: 6px; z-index: 60;
            }
            .mbtn {
                flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
                height: 58px; border-radius: 12px; border: 1px solid rgba(127,216,255,0.35);
                background: rgba(18,18,24,0.82); color: #f1d78a; font-size: 11px; letter-spacing: 1px;
                backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 0; font-family: inherit;
            }
            .mbtn b { font-size: 19px; font-weight: 400; line-height: 1; }
            .mbtn:active { background: rgba(127,216,255,0.24); color: #fff; }
            #mobile-bar.hidden { display: none !important; }
        }
        @media (max-width: 900px) and (max-height: 460px) {
            #left-sidebar { max-height: 84vh; max-height: 84dvh; }
        }
        @media (hover: none) and (pointer: coarse) and (max-height: 460px) {
            .mbtn { height: 44px; font-size: 10px; letter-spacing: 0; }
            .mbtn b { font-size: 15px; }
            #gesture-hint { display: none; }
            #left-sidebar { bottom: calc(52px + env(safe-area-inset-bottom)); max-height: 78vh; max-height: 78dvh; }
            #webcam-wrapper { width: 78px; height: 58px; }
            #title-container { top: 4%; }
        }
/* ============================================================
   交互页移动端 UI 精修补丁（星海深处 / 圣诞树 共用）
   设计稿：mobile-ui-interaction-redesign.html
   原则：只改视觉尺寸/圆角/间距，不碰 .hidden / .panel-hidden / .camera-hidden 的显隐机制
   配色通过 --accent-gold / --accent-gold-gradient 自动适配冷蓝 / 暖金
   ============================================================ */
@media (max-width: 760px), (hover: none) and (pointer: coarse) {
  /* ---------- 移动控制条：更大触控区、更精致 ---------- */
  #mobile-bar { gap: 7px; }
  .mbtn {
    height: 62px;
    border-radius: 14px;
    border-color: rgba(159,198,255,.32);
    background: rgba(10,18,36,.86);
    box-shadow: 0 8px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    font-size: 11px;
    letter-spacing: .5px;
    color: var(--accent-gold);
  }
  .mbtn b { font-size: 21px; line-height: 1.1; }
  .mbtn:active { transform: scale(.96); }

  /* ---------- 设置面板：全屏底部抽屉、圆角顶、分区标签 ---------- */
  #left-sidebar {
    border-radius: 24px 24px 0 0 !important;
    background: rgba(10,18,36,.94) !important;
    border: 1px solid rgba(159,198,255,.24) !important;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06) !important;
    max-height: 72dvh;
    padding-top: 0;
  }
  #left-sidebar::before {
    content: ""; display: block; width: 38px; height: 4px; border-radius: 2px;
    background: rgba(159,198,255,.35); margin: 9px auto 2px; flex: none;
  }
  #left-sidebar .ui-title-main { font-size: 17px; padding: 10px 0 8px; letter-spacing: 3px; }
  .ui-title-sub {
    font-size: 10px; letter-spacing: .18em; color: var(--accent-gold);
    border-bottom: 1px solid rgba(159,198,255,.2); padding-bottom: 5px; margin: 14px 0 10px;
  }
  .control-label { font-size: 12px; color: #bcd4f5; }
  .elegant-btn {
    min-height: 44px; font-size: 12px !important; border-radius: 11px;
    border-color: rgba(159,198,255,.3);
    background: rgba(159,198,255,.07);
  }
  .elegant-btn:active { transform: scale(.98); }
  input[type=range] { height: 30px; }
  input[type=range]::-webkit-slider-thumb { height: 18px; width: 18px; margin-top: -9px; }
  .input-glass, select.input-glass, input[type=text] { height: 42px; font-size: 16px !important; border-radius: 9px; }
  .particle-scroll-container { max-height: 190px; }
  .bottom-left-panel { border-radius: 16px; }
  .bottom-left-panel .elegant-btn { min-height: 44px; }
  .dir-btn { min-height: 46px; line-height: 46px; font-size: 17px; border-radius: 10px; }

  /* ---------- 照片管理弹窗：全屏网格、大图格、固定底部操作栏 ---------- */
  #delete-manager {
    background: rgba(6,10,20,.94) !important;
    justify-content: flex-start !important;
    box-sizing: border-box !important;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    backdrop-filter: blur(12px);
  }
  .manager-title {
    font-size: 20px; letter-spacing: 3px; padding: 8px 0 12px;
    color: var(--accent-gold); position: relative; width: 100%; text-align: center;
  }
  .manager-title::after {
    content: ""; display: block; width: 40px; height: 3px; border-radius: 2px;
    background: var(--accent-gold-gradient); margin: 8px auto 0;
  }
  #photo-grid {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    grid-auto-rows: minmax(108px, auto);
    gap: 11px !important;
    width: 100% !important; height: auto !important; flex: 1;
    max-height: none !important; overflow-y: auto;
    padding: 4px 2px 12px !important; margin: 0 !important;
    border: none !important; background: transparent !important;
    align-content: start;
  }
  .photo-item {
    width: 100% !important; height: 100% !important; min-height: 108px;
    border-radius: 12px !important; border: 1px solid rgba(159,198,255,.24) !important;
    overflow: hidden; box-sizing: border-box;
  }
  .photo-thumb { border-radius: 11px; }
  .delete-x {
    top: 7px !important; right: 7px !important; width: 26px !important; height: 26px !important;
    line-height: 24px !important; font-size: 15px !important; border-radius: 50% !important;
  }
  .manager-actions {
    display: flex; gap: 10px; width: 100%; padding: 12px 0 4px; flex: none;
  }
  .manager-actions .elegant-btn { flex: 1; min-height: 46px; }

  /* ---------- 手势提示：底部大字提示条 ---------- */
  #gesture-hint {
    font-size: 12px; letter-spacing: .5px; line-height: 1.6;
    padding: 8px 14px; border-radius: 10px;
    background: rgba(10,18,36,.55); width: auto; left: 16px; right: 16px;
    color: var(--accent-gold);
  }

  /* ---------- 面板打开时：收起主标题与底部控制条，避免遮挡/叠字 ---------- */
  /* 仅视觉层级，不改动任何 JS 显隐（.hidden / .panel-hidden 照常由 JS 控制） */
  body:has(#left-sidebar:not(.panel-hidden)) #title-container { opacity: 0; pointer-events: none; }
  body:has(#delete-manager:not(.hidden)) #title-container,
  body:has(#delete-manager:not(.hidden)) #mobile-bar,
  body:has(#delete-manager:not(.hidden)) #gesture-hint,
  body:has(#delete-manager:not(.hidden)) #left-sidebar { opacity: 0 !important; pointer-events: none !important; }
  /* 照片管理空状态居中（JS 会插入 <div style="color:#888">暂无照片</div>） */
  #photo-grid > div:only-child:not(.photo-item) {
    display: flex !important; align-items: center; justify-content: center;
    width: 100%; min-height: 200px; font-size: 13px; color: rgba(159,198,255,.6) !important;
  }

        function createPhotoTexture(b,id){

            camStarting = true;
            try {
                if (camStream) { camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); camStream = null; }
                setCamState('requesting');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
                    audio: false
                });
                camStream = stream;
                videoElement = document.getElementById('webcam-video');
                videoElement.srcObject = stream;
                await videoElement.play().catch(() => {});
                renderWebcamPreview();
                const track = stream.getVideoTracks()[0];
                if (track) track.addEventListener('ended', () => setCamState('ended'));
                setCamState('live');
                return true;
            } catch (e) {
                const n = (e && e.name) || '';
                if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') {
                    setCamState('denied', '在地址栏摄像头图标里允许');
                } else if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError') {
                    setCamState('busy', '关掉其他占用摄像头的标签页');
                    setTimeout(() => { if (CAM_STATE === 'busy') startCamera(); }, 4000);
                } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') {
                    setCamState('no-device');
                } else {
                    setCamState('error', n || String(e));
                }
                console.warn('camera unavailable', e);
                return false;
            } finally {
                camStarting = false;
            }
        }

        async function initMediaPipe() {
            await startCamera();
            try {
                const v = await FilesetResolver.forVisionTasks("./vendor/mediapipe/wasm");
                const simd = await FilesetResolver.isSimdSupported();
                v.wasmBinaryPath = simd
                    ? "https://registry.npmmirror.com/@mediapipe/tasks-vision/0.10.3/files/wasm/vision_wasm_internal.wasm"
                    : "https://registry.npmmirror.com/@mediapipe/tasks-vision/0.10.3/files/wasm/vision_wasm_nosimd_internal.wasm";
                const opts = (delegate) => ({ baseOptions: { modelAssetPath: "https://cdn.jsdmirror.com/npm/ptmaker-vision-models@1.0.0/hand_landmarker.task", delegate: delegate }, runningMode: "VIDEO", numHands: 1 });
                try { handLandmarker = await HandLandmarker.createFromOptions(v, opts("GPU")); }
                catch (errGPU) { console.warn('GPU delegate failed, retry CPU', errGPU); handLandmarker = await HandLandmarker.createFromOptions(v, opts("CPU")); }
                predictWebcam();
            } catch (e) { console.warn('hand model failed', e); }
        }

        (function bindCamRetry() {
            const b = document.getElementById('cam-retry');
            if (b) b.addEventListener('click', () => { if (handLandmarker) startCamera(); else initMediaPipe(); });
        })();

        window.addEventListener('pagehide', () => {
            if (camStream) camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
        });
        function renderWebcamPreview(){const c=document.getElementById('webcam-canvas'),x=c.getContext('2d',{willReadFrequently:true});function d(){if(videoElement.readyState>=2)x.drawImage(videoElement,0,0,c.width,c.height);requestAnimationFrame(d)}d()}
        let lvt=-1,lastDetect=0;async function predictWebcam(){if(videoElement&&handLandmarker&&videoElement.readyState>=2&&videoElement.currentTime!==lvt){const now=performance.now();if(now-lastDetect>=(IS_MOBILE?70:33)){lastDetect=now;lvt=videoElement.currentTime;try{const r=handLandmarker.detectForVideo(videoElement,now);processGestures(r);refreshHint();document.getElementById('cam-status').classList.toggle('active',r.landmarks.length>0);}catch(e){console.warn(e);}}}requestAnimationFrame(predictWebcam);}
        function processGestures(r){if(r.landmarks&&r.landmarks.length>0){STATE.hand.detected=true;const lm=r.landmarks[0];STATE.hand.x=(lm[9].x-0.5)*2;STATE.hand.y=(lm[9].y-0.5)*2;const thumb=lm[4],index=lm[8],wrist=lm[0],middle=lm[12];const pd=Math.hypot(thumb.x-index.x,thumb.y-index.y);const od=Math.hypot(middle.x-wrist.x,middle.y-wrist.y);if(STATE.mode==='FOCUS'){if(pd>0.1)setMode('SCATTER');return;}if(pd<0.05&&STATE.mode!=='FOCUS')triggerPhotoGrab();else if(od>0.4)setMode('SCATTER');else if(od<0.2)setMode('TREE');}else STATE.hand.detected=false;}

        window.setupEvents=()=>{
            window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);composer.setSize(window.innerWidth,window.innerHeight)});
            document.getElementById('file-input').addEventListener('change',e=>{Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{const i=new Image();i.src=ev.target.result;i.onload=()=>{const id=savePhotoToDB(ev.target.result);createPhotoTexture(ev.target.result,id)}};r.readAsDataURL(f)})});
            document.getElementById('music-input').addEventListener('change',e=>{const f=e.target.files[0];if(f){saveMusicToDB(f);bgmAudio.src=URL.createObjectURL(f);bgmAudio.play().then(()=>{isMusicPlaying=true;updatePlayBtnUI(true)}).catch(console.error)}});
            
            // 键盘交互
window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                const code = e.code;
                const k = e.key.toLowerCase();
                
                if (k === 'h') window.toggleUI();
                if (code === 'Space') { e.preventDefault(); setMode('TREE'); }
                if (k === 'z') setMode('SCATTER');
                if (k === 'x') triggerPhotoGrab();

                if (code === 'ArrowUp') manualRotateState.x = -1;
                if (code === 'ArrowDown') manualRotateState.x = 1;
                if (code === 'ArrowLeft') manualRotateState.y = -1;
                if (code === 'ArrowRight') manualRotateState.y = 1;
            });
            window.addEventListener('keyup', (e) => {
                const code = e.code;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) manualRotateState = { x: 0, y: 0 };
            });
        }
        window.openDeleteManager=async()=>{document.getElementById('delete-manager').classList.remove('hidden');const g=document.getElementById('photo-grid');g.innerHTML='';const ps=await loadPhotosFromDB();if(!ps||ps.length===0)g.innerHTML='<div style="color:#888;">暂无照片</div>';else ps.forEach(p=>{const d=document.createElement('div');d.className='photo-item';const i=document.createElement('img');i.className='photo-thumb';i.src=p.data;const b=document.createElement('div');b.className='delete-x';b.innerText='X';b.onclick=e=>{e.stopPropagation();confirmDelete(p.id,d)};d.appendChild(i);d.appendChild(b);g.appendChild(d)})}
        window.confirmDelete=(id,el)=>{deletePhotoFromDB(id);el.remove();const p=particleSystem.find(pa=>pa.photoId===id);if(p){disposePhotoStars(p);photoMeshGroup.remove(p.mesh);particleSystem.splice(particleSystem.indexOf(p),1)}}
        window.clearAllPhotos=()=>{if(confirm("确定要清空所有照片吗？")){clearPhotosDB();particleSystem.filter(p=>p.type==='PHOTO').forEach(p=>{disposePhotoStars(p);photoMeshGroup.remove(p.mesh)});particleSystem=particleSystem.filter(p=>p.type!=='PHOTO');window.openDeleteManager()}}
        window.closeDeleteManager=()=>{document.getElementById('delete-manager').classList.add('hidden')}

        function animate() {
            requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); const et=clock.getElapsedTime();
            if(snowInstancedMesh)snowInstancedMesh.visible=false;
            camera.position.x=Math.sin(et*0.07)*1.2;camera.position.y=8+Math.sin(et*0.05)*0.7;camera.lookAt(0,0,0);

            // Updated Rotation Logic
if(manualRotateState.x!==0||manualRotateState.y!==0){const s=CONFIG.interaction.rotationSpeed*2.0;STATE.rotation.x+=manualRotateState.x*s*dt;STATE.rotation.y+=manualRotateState.y*s*dt;}
            else if(STATE.mode==='SCATTER'&&STATE.hand.detected){const th=0.3,s=CONFIG.interaction.rotationSpeed;if(STATE.hand.x>th)STATE.rotation.y-=s*dt*(STATE.hand.x-th);else if(STATE.hand.x<-th)STATE.rotation.y-=s*dt*(STATE.hand.x+th);if(STATE.hand.y<-th)STATE.rotation.x+=s*dt*(-STATE.hand.y-th);else if(STATE.hand.y>th)STATE.rotation.x-=s*dt*(STATE.hand.y-th);}
            else{if(STATE.mode==='TREE'){STATE.rotation.y+=0.12*dt;STATE.rotation.x+=(0-STATE.rotation.x)*2.0*dt;}else STATE.rotation.y+=0.08*dt;}
            
            mainGroup.rotation.y=STATE.rotation.y;mainGroup.rotation.x=STATE.rotation.x;
            // 星系聚合/散开：shader 里按 uMorph 在盘面与球壳间插值，平滑过渡
            const targetMorph=(STATE.mode==='TREE')?0:1;
            morphCurrent+=(targetMorph-morphCurrent)*Math.min(1,2.4*dt);
            if(galaxyPoints){galaxyPoints.material.uniforms.uMorph.value=morphCurrent;galaxyPoints.material.uniforms.uTime.value=et;}
            if(dustPoints){dustPoints.material.uniforms.uMorph.value=morphCurrent;dustPoints.material.uniforms.uTime.value=et;}
            if(coreGlowSprite){const k=(1-morphCurrent*0.65)*(0.94+0.06*Math.sin(et*0.8));coreGlowSprite.forEach(sp=>{sp.material.opacity=sp.userData.baseOpacity*k;});}
            // 仅照片粒子仍需逐帧更新（聚焦/抓取），星系粒子交给 GPU
            particleSystem.forEach(p=>{
                if(p.type!=='PHOTO') return;
                p.update(dt,STATE.mode,STATE.focusTarget);
                // 星辰相框：仅被抓取聚焦的照片显影，其余隐去，实现「星辰汇聚成像」
                if(p.starSys){
                    const isFocused=(STATE.mode==='FOCUS'&&STATE.focusTarget===p.mesh);
                    const target=isFocused?1:0;
                    const u=p.starSys.mat.uniforms;
                    u.uReveal.value+=(target-u.uReveal.value)*Math.min(1,5.0*dt);
                    u.uTime.value=et;
                    if(p.starSys.plane) p.starSys.plane.material.opacity=0.14*u.uReveal.value;
                }
            });
            composer.render();
        }
        // ================= 移动端运行时 (v17.6.5-m) =================
        const IS_MOBILE = (window.matchMedia && (window.matchMedia('(max-width: 760px)').matches || window.matchMedia('(hover: none) and (pointer: coarse)').matches)) || /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent);
        window.IS_MOBILE = IS_MOBILE;
        if (IS_MOBILE) {
            CONFIG.particles.count = 900;
            CONFIG.particles.dustCount = 700;
            CONFIG.snow.count = 400;
            const setSlider = (id, v, max) => { const el = document.getElementById(id); if (el) { if (max) el.max = max; el.value = v; } };
            setSlider('slider-tree', 900, 1600);
            setSlider('slider-dust', 700, 2500);
            setSlider('slider-snow-count', 400, 1500);
            const sheet = document.getElementById('left-sidebar');
            const bottomPanel = document.querySelector('.bottom-left-panel');
            if (sheet && bottomPanel) sheet.appendChild(bottomPanel);
            window.__sheet = function (open) {
                const s = document.getElementById('left-sidebar');
                if (!s) return;
                s.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1), opacity .35s';
                s.style.transform = open ? 'none' : 'translateY(calc(100% + 130px))';
                s.style.opacity = open ? '1' : '0';
                s.style.pointerEvents = open ? 'auto' : 'none';
                window.__sheetOpen = !!open;
                const btn = document.getElementById('mb-settings');
                if (btn) btn.style.borderColor = open ? 'rgba(127,216,255,.95)' : 'rgba(127,216,255,.35)';
            };
            window.__sheet(false);
            window.toggleUI = function () { window.__sheet(!window.__sheetOpen); };
            document.querySelectorAll('button.elegant-btn').forEach(b => {
                if (!/\((SPACE|Z|X)\)/i.test(b.textContent || '')) return;
                b.textContent = b.textContent.replace(/\s*\((SPACE|Z|X)\)/gi, '').trim();
            });
            document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
        }

        window.toggleFullScreen = function () {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            const active = document.fullscreenElement || document.webkitFullscreenElement;
            if (!active) {
                if (!req) { window.toggleUI(); return; }
                try { const p = req.call(el); if (p && p.catch) p.catch(() => window.toggleUI()); } catch (err) { window.toggleUI(); }
            } else if (exit) { try { exit.call(document); } catch (err) {} }
        };

        (function mobileInput() {
            const surface = document.getElementById('canvas-container');
            if (surface) {
                surface.style.touchAction = 'none';
                const ptrs = new Map();
                let pinch = 0;
                surface.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { surface.setPointerCapture(e.pointerId); } catch (_) {} });
                surface.addEventListener('pointermove', e => {
                    const p = ptrs.get(e.pointerId); if (!p) return;
                    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
                    if (ptrs.size === 1) {
                        STATE.rotation.y += dx * 0.006;
                        STATE.rotation.x = Math.max(-1.0, Math.min(1.0, STATE.rotation.x + dy * 0.004));
                        manualRotateState = { x: 0, y: 0 };
                    } else if (ptrs.size === 2) {
                        const a = [...ptrs.values()];
                        const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
                        if (pinch && camera) camera.position.z = Math.max(26, Math.min(88, camera.position.z - (d - pinch) * 0.22));
                        pinch = d;
                    }
                }, { passive: true });
                const release = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0; };
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => surface.addEventListener(n, release));
            }

            document.querySelectorAll('.dir-btn[onmousedown]').forEach(el => {
                const m = (el.getAttribute('onmousedown') || '').match(/startRotate\('(\w+)'\)/);
                if (!m) return;
                const dir = m[1];
                el.onmousedown = null; el.onmouseup = null; el.onmouseleave = null;
                el.addEventListener('pointerdown', ev => { ev.preventDefault(); window.startRotate(dir); });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => el.addEventListener(n, () => window.stopRotate()));
            });

            const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
            bind('mb-tree', () => window.setMode('TREE'));
            bind('mb-scatter', () => window.setMode('SCATTER'));
            bind('mb-grab', () => window.triggerPhotoGrab());
            bind('mb-cam', () => window.toggleCameraDisplay());
            bind('mb-settings', () => { if (window.__sheet) window.__sheet(!window.__sheetOpen); });

            const unlock = () => {
                if (bgmAudio && bgmAudio.src) bgmAudio.play().then(() => { isMusicPlaying = true; updatePlayBtnUI(true); }).catch(() => {});
                document.removeEventListener('pointerdown', unlock);
            };
            document.addEventListener('pointerdown', unlock);
        })();

        init();
    </script></body></html>
