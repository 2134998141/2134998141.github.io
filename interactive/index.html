<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>交互作品集 · Interactive Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #101a38 0%, #0a1024 40%, #05070f 100%);
    color: #eaf1ff;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 星空背景 */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .stars::before, .stars::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.9) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 45% 65%, rgba(180,215,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,.5) 50%, transparent 51%);
    background-size: 420px 420px;
    animation: drift 90s linear infinite;
  }
  .stars::after { background-size: 300px 300px; opacity: .5; animation-duration: 140s; animation-direction: reverse; }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-420px); } }

  .wrap { position: relative; z-index: 1; width: min(960px, 92vw); margin: 0 auto; padding: 9vh 0 6vh; }

  .back {
    display: inline-flex; align-items: center; gap: 8px;
    color: #93a9cc; text-decoration: none; font-size: 14px;
    padding: 8px 16px; border: 1px solid rgba(147,169,204,.25);
    border-radius: 999px; transition: .25s; margin-bottom: 40px;
  }
  .back:hover { color: #dbe7ff; border-color: rgba(219,231,255,.5); background: rgba(147,169,204,.08); }

  .head { text-align: center; margin-bottom: 56px; }
  .head .kicker {
    font-size: 13px; letter-spacing: 5px; text-transform: uppercase;
    color: #7ea6d8; margin-bottom: 18px;
  }
  .head h1 {
    font-size: clamp(34px, 6vw, 60px); font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(100deg, #eaf3ff 0%, #8fc6ff 55%, #b8a4ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(143,198,255,.25);
  }
  .head p { color: #8fa3c4; margin-top: 16px; font-size: 15px; line-height: 1.8; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    border-radius: 20px; overflow: hidden; min-height: 300px;
    padding: 34px 30px; display: flex; flex-direction: column; justify-content: flex-end;
    border: 1px solid rgba(255,255,255,.1);
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, border-color .5s;
    isolation: isolate;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: -2; transition: transform .7s;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(to top, rgba(5,7,15,.92) 0%, rgba(5,7,15,.35) 55%, transparent 100%);
  }
  .card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,.28); }
  .card:hover::before { transform: scale(1.08); }
  .card .glow { position: absolute; z-index: -1; width: 240px; height: 240px; border-radius: 50%; filter: blur(70px); opacity: .5; top: -60px; right: -40px; transition: opacity .5s; }
  .card:hover .glow { opacity: .8; }

  .card-xmas::before { background: linear-gradient(135deg, #0b3d2e 0%, #123a2a 30%, #1a1b2e 70%, #3a1c14 100%); }
  .card-xmas .glow { background: #d9a441; }
  .card-xmas { box-shadow: 0 18px 50px -20px rgba(40,140,90,.4); }
  .card-xmas:hover { box-shadow: 0 26px 60px -18px rgba(60,170,110,.55); }

  .card-sky::before { background: linear-gradient(135deg, #0a1836 0%, #0d2148 35%, #101034 70%, #24124a 100%); }
  .card-sky .glow { background: #5aa8ff; }
  .card-sky { box-shadow: 0 18px 50px -20px rgba(50,110,210,.4); }
  .card-sky:hover { box-shadow: 0 26px 60px -18px rgba(90,150,255,.55); }

  .tag {
    align-self: flex-start; font-size: 12px; letter-spacing: 1px;
    padding: 5px 12px; border-radius: 999px; margin-bottom: auto;
    border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.8);
  }
  .card h2 { font-size: 30px; margin-bottom: 10px; letter-spacing: 1px; }
  .card-xmas h2 { color: #ffe6b0; text-shadow: 0 0 24px rgba(255,210,130,.35); }
  .card-sky h2 { color: #d6ecff; text-shadow: 0 0 24px rgba(140,200,255,.35); }
  .card .desc { font-size: 14px; line-height: 1.7; color: rgba(233,241,255,.78); margin-bottom: 20px; }
  .card .go {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
    transition: gap .3s;
  }
  .card:hover .go { gap: 14px; }
  .card-xmas .go { color: #ffd98a; }
  .card-sky .go { color: #9fc6ff; }

  .foot { text-align: center; color: #56698a; font-size: 12px; margin-top: 60px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <a class="back" href="/">← 返回首页</a>
  <div class="head">
    <div class="kicker">Interactive Lab</div>
    <h1>交互作品集</h1>
    <p>用鼠标、手势与光影，把想象变成可以走进去的场景。<br>选一个入口开始探索。</p>
  </div>
  <div class="grid">
    <a class="card card-xmas" href="/christmas-tree-v17.6/">
      <span class="glow"></span>
      <span class="tag">手势交互 · 圣诞</span>
      <h2>圣诞树 v17.6</h2>
      <p class="desc">粒子汇聚成树，捏合抓取照片，张手散作星尘。<br>用手势与它对话。</p>
      <span class="go">进入体验 <span>→</span></span>
    </a>
    <a class="card card-sky" href="/deep-sky/">
      <span class="glow"></span>
      <span class="tag">手势交互 · 星空</span>
      <h2>星海深处</h2>
      <p class="desc">冷白旋转臂与暖金银心，握拳聚成银河，<br>张手散入深空。</p>
      <span class="go">进入体验 <span>→</span></span>
    </a>
  </div>
  <div class="foot">DEEP SKY · INTERACTIVE COLLECTION</div>
</div>
</body>
</html>
